<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Doc Assistant — Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen flex flex-col">
  <header class="w-full shadow-sm">
    <nav class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-600" viewBox="0 0 24 24" fill="currentColor"
          aria-hidden="true">
          <path d="M12 2a7 7 0 00-7 7v3a3 3 0 003 3h1v3a1 1 0 001.447.894L13 18h2a3 3 0 003-3V9a7 7 0 00-7-7z" />
        </svg>
        <span class="text-lg font-semibold text-gray-800">AI Doc Assistant</span>
      </div>
      <div>
        <a href="index.html"
          class="inline-block px-4 py-2 rounded-md border border-indigo-600 text-indigo-600 hover:bg-indigo-50 transition">Login</a>
      </div>
    </nav>
  </header>

  <main class="flex-1 flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md">
      <div class="bg-white rounded-2xl shadow-md p-8">
        <h1 class="text-2xl font-bold text-gray-800 text-center">Create account</h1>
        <p class="text-sm text-gray-600 mt-2 text-center">Sign up to start uploading your PDF portfolio</p>

        <form class="mt-6 space-y-5" id="signupForm">
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
            <div class="mt-1">
              <input id="username" name="username" type="text" required
                class="block w-full px-3 py-2 rounded-md border border-gray-300" placeholder="choose a username" />
            </div>
          </div>
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
            <div class="mt-1">
              <input id="email" name="email" type="email" required
                class="block w-full px-3 py-2 rounded-md border border-gray-300" placeholder="you@example.com" />
            </div>
          </div>

          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <div class="mt-1">
              <input id="password" name="password" type="password" required
                class="block w-full px-3 py-2 rounded-md border border-gray-300" placeholder="••••••••" />
            </div>
          </div>

          <div>
            <button type="submit" class="w-full px-4 py-2 rounded-md bg-indigo-600 text-white font-medium">Sign
              up</button>
          </div>
        </form>

      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-xs text-gray-500">© <span id="year"></span> AI Doc Assistant</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const API = "http://127.0.0.1:5001";

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      try {
        const res = await fetch(API + "/signup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, email, password })
        });
        const data = await res.json();
        if (!res.ok) return alert(data.message || 'Signup failed');
        alert('Account created — you can now log in.');
        window.location.href = 'index.html';
      } catch (err) {
        alert('Network error: ' + err.message);
      }
    });
  </script>
</body>

</html>
